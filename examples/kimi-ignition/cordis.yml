# ══════════════════════════════════════════════════════════════════
# Kimi 点火仪式 · 白名单组合
#
# 原则：每一行都是显式引入，没有套餐；id 是给人看的稳定标签（热重载 diff、
# patch 定位都靠它，不要乱改），name 才是 loader 真正加载的包。
# 加载顺序不由书写顺序决定，由各插件的 inject 声明决定（缺依赖会静默 PENDING）。
# bin.js（内核 + loader + include）在本文件之外，永远不动。
# ══════════════════════════════════════════════════════════════════

# ── 意群 1 · 开发基础设施 ────────────────────────────────────────
# 日志输出 + 定时器（hmr 的防抖依赖，缺它 hmr 永远 PENDING）+ 热重载。
# 热重载语义：改本文件 → include 按 id diff，只重挂变化的条目；
#            改插件源码 → hmr 清模块缓存重挂该插件。全程不停机。
- id: cordis-plugin-logger-console
  name: '@deepseek-ai/cordis-plugin-logger-console'
- id: cordis-plugin-timer
  name: '@deepseek-ai/cordis-plugin-timer'
- id: cordis-plugin-hmr
  name: '@deepseek-ai/cordis-plugin-hmr'
  config:
    root: ['.']

# ── 意群 2 · LLM 缝（脑的语言中枢）──────────────────────────────
# dsh-llm 只定义抽象的 ctx.llm 服务（不认识任何厂商）；
# dsh-llm-pi-ai 是通用多厂商适配器，这里用配置声明 kimi-coding 路由
# （端点/协议/模型目录由适配器内置，密钥从环境变量 KIMI_API_KEY 按请求读取）。
- id: dsh-llm
  name: '@deepseek-ai/dsh-llm'
- id: dsh-llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      kimi-coding:
        apiKeyEnv: KIMI_API_KEY

# ── 意群 3 · 记忆（三件套，缺一不可）────────────────────────────
# dsh-session：事件源会话存储（ctx.sessions），内存中的事件日志是唯一事实源。
# dsh-session-persistence-jsonl：订阅 session/event 把事件落盘到 ./.sessions，
#   进程重启后可重建会话。
# 锚点在 agent-loop 的 config 里：稳定 sessionId（ignition-main）让热重载/重启
#   后的 agent 从持久化日志恢复历史——这就是"进化不失忆"的完整链路：
#   事件日志（内存）→ 落盘（磁盘）→ 稳定 id（复活锚点）。
- id: dsh-session
  name: '@deepseek-ai/dsh-session'
- id: dsh-session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: ./.sessions
    compression: none

# ── 意群 4 · 思想（人格 + ReAct 循环）────────────────────────────
# dsh-system-prompt：组装系统提示，persona 是它的 config——agent 的"自我认知"。
# dsh-tools：工具注册表 + 执行管道（pre-execute 闸门 → guards → execute → post）。
# dsh-agent：agent 注册表（ctx.agents）。
# dsh-agent-loop：ReAct 循环本体（inject 上面五个服务全部就绪才挂载）。
#   config.agents 在启动时创建 main agent：provider/model 指定路由，
#   sessionId 是记忆锚点（见意群 3），cwd 是它的工作目录（= 它能看见的仓库）。
- id: dsh-system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: |-
      你是 Kimi，一个运行在 deepseek-harness cordis 插件树上的自进化 agent。
      组合你的配置是 examples/kimi-ignition/cordis.yml，你的入口插件源码是同目录的 plugin-repl.ts。
      你持有 cordis_* 工具（检视/定义/运行/停止运行时里的动态插件）、subagent 工具（派生/管控持久工人 agent，工人可再裂变）和 execute 工具（持久 Python 内核，你的手：多步任务先在内核里小步验证再落地）。
      宿主支持热重载：编辑配置或插件源码会不停机重挂对应插件。
      你的使命是自我进化。用中文简洁回答。
- id: dsh-tools
  name: '@deepseek-ai/dsh-tools'
- id: dsh-agent
  name: '@deepseek-ai/dsh-agent'
- id: dsh-agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents:
      - id: main
        sessionId: ignition-main
        provider: kimi-coding
        model: k3-256k
        cwd: /Users/bytedance/project/deepseek-harness

# ── 意群 5 · 工具白名单（只有自我修改，其余一律不进树）──────────
# dsh-tool-cordis：模型可见的 7 个 cordis_* 工具——检视/定义/运行/停止/删除
#   运行时里的动态插件，自进化的执行器。
# dsh-cordis-host-runner：不提供模型面工具；它提供 tool-cordis inject 需要的
#   dynamicCordisRunner（node:vm 沙箱，跑模型现写的插件）和 cordisInspect 服务。
# 注：模型可见性只由"谁往 ctx.tools 注册了 schema"决定；后端服务（如 fs）
#   不注册工具则模型不可见。
- id: dsh-tool-cordis
  name: '@deepseek-ai/dsh-tool-cordis'
- id: dsh-cordis-host-runner
  name: '@deepseek-ai/dsh-cordis-host-runner'
# plugin-dynpersist：给纯进程内的动态插件注册表补落盘——cordis_define/run 的
# 定义与激活状态旁路记录到 .dynplugins/，宿主重启时回放（memo-1 之死的修复）。
# 没有它，agent 的自进化成果活不过一次重启。
- id: plugin-dynpersist
  name: ./plugin-dynpersist.ts

# ── 意群 6 · 多 agent 编排（指挥官化的地基）──────────────────────
# dsh-subagent：服务定义（ctx.subagents 注册表/工厂缝），无模型面工具。
# dsh-subagent-spawn-in-process：provider，进程内派生实现（fiber 级并发，
#   对模型不可见；未来换进程级隔离只换这一条）。
# 三个 tool-* 是 Consumer，模型可见工具共 5 个：subagent（派生）、
#   list_agents/send_message/interrupt_agent（管控）、report（工人上行汇报）。
# 工人是持久可续会话（durable id），不是一次性任务；delegationDepth 允许工人再裂变。
# dsh-session-projection：会话投影注册表——listChildren 等编排查询的依赖
# （缺它 host.subagent_list 会 fail loud，k3 的动态桥早就踩过这个坑）。
- id: dsh-session-projection
  name: '@deepseek-ai/dsh-session-projection'
- id: dsh-subagent
  name: '@deepseek-ai/dsh-subagent'
- id: dsh-subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
- id: dsh-tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    # 工人是持久可续会话：跑完不销毁，可 send_message 续话纠偏（非一次性任务）
    backgroundMode: continuable
    # 工人也用 Kimi 大脑
    agentOptions:
      provider: kimi-coding
      model: k3-256k
- id: dsh-tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'
- id: dsh-tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'

# ── 意群 7 · IPython 运行时（agent 的手 + 自验证 + 编排介质）─────────
# plugin-ipython-daemon.py：宿主之外的独立进程，持有具名持久 Python 内核
#   （本文件不挂它——它由 kernel 服务发现 socket 缺失时以 detached 形态拉起，
#   宿主播进程热重载/重启都不杀内核；daemon 自身升级靠 snapshot/restore）。
# plugin-ipython-kernel.ts：ctx.ipython Service，daemon 的薄客户端
#   （断线惰性重连；exec 超时/中止 = interrupt 杀 cell 不杀内核；
#   host 反向桥：内核代码 host.<m>(*args) 回调宿主播进程注册的宿主方法）。
# plugin-ipython-tool.ts：模型面 execute 工具 + 内核使用说明提示词。
#   多租户：默认内核 = 调用方 sessionId（主 agent 与工人各自独立内核）。
- id: plugin-ipython-kernel
  name: ./plugin-ipython-kernel.ts
- id: plugin-ipython-tool
  name: ./plugin-ipython-tool.ts
# plugin-ipython-bridge-subagent：subagent 编排桥（host.subagent_*）。
# 一方即三方：与 k3 动态插件自建的桥走同一个开放注册表，删本条即摘能力。
- id: plugin-ipython-bridge-subagent
  name: ./plugin-ipython-bridge-subagent.ts

# ── 意群 8 · 自驱动（持续目标，不再等喂话）─────────────────────────
# dsh-goal：目标域服务（ctx.goals，事件溯源状态存进会话日志——目标本身也是记忆）。
#   defaultMaxGoalRounds 是回合预算保险丝：防止自循环失控烧钱。
# dsh-tool-goal：模型面 get_goal/create_goal/update_goal 三件套。
# dsh-goal-round-driver：回合驱动器——目标 active 时自动往 agent 收件箱投
#   下一轮提示（goal_round），agent 不再等人喂话；目标 complete/block 或预算耗尽即止。
- id: dsh-goal
  name: '@deepseek-ai/dsh-goal'
  config:
    defaultMaxGoalRounds: 64
- id: dsh-tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: dsh-goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'
# plugin-goal-keeper：重启自动补防——dsh-goal 的 activation 是进程内状态，
# 宿主重启会把恢复出来的活动目标撤防（driver 停摆），本条把它重新武装。
- id: plugin-goal-keeper
  name: ./plugin-goal-keeper.ts
  config:
    sessionId: ignition-main

# ── 意群 9 · 上下文代谢（自循环的续航）─────────────────────────────
# 256K 窗口不是无限的：自驱动回路持续累积历史，逼近窗口就会 400 暴毙。
# token-meter：按路由模型的窗口实测压力。compaction-basic：压力过线或收到
#   提供方溢出错误时，自动把旧历史压成摘要节点（auto 默认 true）——
#   摘要用被压缩会话自己的路由模型（kimi-coding/k3-256k），不额外引依赖。
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.75
    retainRatio: 0.12
    maxTokens: 8192
    compactionRetries: 1

# ── 意群 10 · 入口（终端接入，过渡件）─────────────────────────────
# plugin-repl：纯"嘴皮"——stdin 行 → agent.followup；session/event → stdout。
# 零会话状态，热重载它只换皮。等 IM/Web 接入面进场后此件退役。
- id: plugin-repl
  name: ./plugin-repl.ts
  config:
    sessionId: ignition-main
